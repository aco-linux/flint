# Caps Lock as Hyper, tap still Caps Lock.
# Flint does not ship a remapper. Install keyd or kanata yourself.
#
# keyd — /etc/keyd/default.conf
#
# [ids]
# *
#
# [main]
# capslock = overload(hyper, capslock)
#
# [hyper]
# # Hold Caps and tap a key. Bind the resulting combos in Hyprland,
# # not here, unless you want keyd to consume them.
#
# kanata — ~/.config/kanata/kanata.kbd (excerpt)
#
# (defsrc caps)
# (deflayer base (tap-hold 200 200 caps lmet))
#
# Job 19 is desktop glue. Job 88 (focused-app menu search) is not
# AT-SPI — Flint never polls the a11y bus.
