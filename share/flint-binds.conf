# Optional Hyprland binds for Flint. Flint does not own the compositor
# and does not install a helper daemon. Source this file yourself:
#
#   source = ~/.config/hypr/flint-binds.conf
#
# Hyprland hot-reloads sourced files. Flint copies this snippet to
# ~/.config/hypr/flint-binds.conf only when that path is missing — it
# never overwrites your hyprland.conf or an existing binds file.
#
# Uncomment the binds you want. Super+Space stays Omarchy's menu.

# bind = ALT, SPACE, exec, flint
# bind = SUPER SHIFT, F, exec, flint --files
# bind = SUPER SHIFT, R, exec, flint --windows
# bind = SUPER SHIFT, V, exec, flint --clipboard

# Focus 25m and dictate-to-app are in-bar commands (no dedicated CLI).
# Open Flint, then run "Start focus 25m" / "Dictate to focused app".
# bind = SUPER SHIFT, T, exec, flint
# bind = SUPER SHIFT, D, exec, flint --voice
