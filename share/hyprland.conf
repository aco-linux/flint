# Keep a resident instance so clipboard history stays warm.
exec-once = flint --daemon

# Optional extra binds (focus, dictate, clipboard, files, windows).
# Flint copies the snippet to this path only if it is missing.
# source = ~/.config/hypr/flint-binds.conf

# Super+Space stays Omarchy's menu. Alt+Space is Flint.
bind = ALT, SPACE, exec, flint
bind = SUPER SHIFT, F, exec, flint --files
bind = SUPER SHIFT, R, exec, flint --windows
bind = SUPER SHIFT, V, exec, flint --clipboard
bind = SUPER SHIFT, S, exec, flint --snippets
bind = SUPER SHIFT, N, exec, flint --notes
bind = SUPER SHIFT, A, exec, flint --ask
bind = SUPER SHIFT, D, exec, flint --voice
bind = SUPER SHIFT, comma, exec, flint --settings

# Optional Wave 2 binds. Flint exposes these as commands; it does not
# install compositor hotkeys. Uncomment if you want them at the WM layer.
# bind = SUPER, LEFT, exec, hyprctl dispatch movewindow l
# bind = SUPER, RIGHT, exec, hyprctl dispatch movewindow r
# bind = , Print, exec, grim "$HOME/Pictures/Screenshots/flint-$(date +%Y%m%d-%H%M%S).png"
# bind = SUPER SHIFT, Print, exec, flint # then type screenshot / region / record

# Start Flint as a centered floating window. It remains a normal window with
# title-bar controls, compositor borders, and ordinary move/resize behavior.
# `no_anim` is required: without it Hyprland tiles first, then animates the
# shrink down to 980x720.
#
# Hyprland 0.55+ (Lua config):
-- hl.window_rule({
--     name = "flint-float",
--     match = { class = "dev.flint.launcher" },
--     float = true,
--     center = true,
--     size = {980, 720},
--     no_anim = true,
-- })
-- hl.window_rule({
--     name = "flint-float-initial",
--     match = { initial_class = "dev.flint.launcher" },
--     float = true,
--     center = true,
--     size = {980, 720},
--     no_anim = true,
-- })
#
# Hyprland 0.54 and older (hyprlang):
windowrulev2 = float, class:^(dev\.flint\.launcher)$
windowrulev2 = center, class:^(dev\.flint\.launcher)$
windowrulev2 = size 980 720, class:^(dev\.flint\.launcher)$
windowrulev2 = noanim, class:^(dev\.flint\.launcher)$
windowrulev2 = float, initialClass:^(dev\.flint\.launcher)$
windowrulev2 = center, initialClass:^(dev\.flint\.launcher)$
windowrulev2 = size 980 720, initialClass:^(dev\.flint\.launcher)$
windowrulev2 = noanim, initialClass:^(dev\.flint\.launcher)$
windowrule = float, class:dev.flint.launcher
windowrule = center, class:dev.flint.launcher
windowrule = size 980 720, class:dev.flint.launcher
windowrule = noanim, class:dev.flint.launcher
