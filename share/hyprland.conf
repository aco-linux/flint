# Keep a resident instance so clipboard history stays warm.
exec-once = flint --daemon

# Omarchy binds Super+Space to its menu. Unbind that first, then:
bind = SUPER, SPACE, exec, flint
bind = SUPER SHIFT, R, exec, flint --windows
bind = SUPER SHIFT, V, exec, flint --clipboard
bind = SUPER SHIFT, S, exec, flint --snippets
bind = SUPER SHIFT, N, exec, flint --notes
bind = SUPER SHIFT, A, exec, flint --ask
bind = SUPER SHIFT, D, exec, flint --voice
bind = SUPER SHIFT, comma, exec, flint --settings

layerrule = noanim, flint
layerrule = blur, flint
layerrule = ignorezero, flint

# Fallback if the overlay maps as an xdg window instead of a layer.
windowrulev2 = float, class:^(dev\.flint\.Launcher)$
windowrulev2 = center, class:^(dev\.flint\.Launcher)$
windowrulev2 = pin, class:^(dev\.flint\.Launcher)$
windowrulev2 = stayfocused, class:^(dev\.flint\.Launcher)$
windowrulev2 = dimaround, class:^(dev\.flint\.Launcher)$
windowrulev2 = noborder, class:^(dev\.flint\.Launcher)$
windowrulev2 = noshadow, class:^(dev\.flint\.Launcher)$
