name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            meson \
            ninja-build \
            libgtk-4-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgraphene-1.0-dev \
            libwayland-dev \
            wayland-protocols \
            libgirepository1.0-dev
          if ! sudo apt-get install -y --no-install-recommends libgtk4-layer-shell-dev; then
            git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
            meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell --prefix=/usr
            meson compile -C /tmp/gtk4-layer-shell/build
            sudo meson install -C /tmp/gtk4-layer-shell/build
          fi
      - name: Test
        run: cargo test --locked
